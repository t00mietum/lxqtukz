##	LXQtukz updater settings: one KEY=value per line. An empty value means the default.
##	Copy to /etc/xdg/lxqtukz/update.conf to change it; that copy wins over this one.

## yes|no - whether the daily timer installs updates on its own. (default: yes)
AUTO_UPDATE=yes

## stable|dev - stable takes full releases only; dev also takes pre-releases. (default: stable)
CHANNEL=stable

## A version to stay on, e.g. 0.3.1. When set, the timer installs exactly this
## version, older or newer, and nothing past it. Empty follows CHANNEL. (default: empty)
PIN=

## How many installed versions to keep for instant rollback. Never prunes the
## active one or one a running session is using. (default: 3)
KEEP=3

## NixOS only: the system flake that declares the 'lxqtukz' input, and how to
## apply a change to it: boot (next reboot) or switch (now). (default: /etc/nixos, boot)
FLAKE=/etc/nixos
NIXOS_REBUILD=boot
