##	Upstream pins for LXQtukz. One component per line, in build order.
##	- name:   component name; also the patch queue dir (patches/<name>/) and flags file (upstream/flags/<name>).
##	- url:    upstream git repo. Point it at a t00mietum fork if a component ever outgrows a patch queue.
##	- ref:    upstream release tag the queue applies to.
##	- commit: the commit that tag resolved to when pinned. Checked on every apply, so a moved tag is caught.
##	- build:  cmake or meson.
##	- nix:    the nixpkgs attribute this overrides on NixOS, or - for one built on
##	          Debian only, because Debian 13 is too old for Wayfire and nixpkgs is not.
##	Edited by `cicd/upstream.bash bump`; hand edits are fine but keep one row per line.

